<script>
    // Factory function to create car objects

    function createCar(make, model, year) {
        return {
            make: make,
            model: model,
            year: year,
            getCarInfo: function () {
                return `${this.year} ${this.make} ${this.model}`;
            }
        };
    }


    const car1 = createCar('Toyota', 'Corolla', 2021);
    let car1Details = car1.getCarInfo();
    console.log("car1Details = ", car1Details);

</script>


<script>
