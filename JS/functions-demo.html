<!DOCTYPE html>
<html>

<head>
    <script>
        //function definition
        function f1(){
            console.log("Hello Everyone!");
        }

        //invocation or execution of a function
        f1();

    </script>

    <script>
        //function definition of one that takes inputs
        function f2(name){
            console.log("Hello " + name + " !");
        }

        //invocation or execution of a function
        f2("Rajesh");
        f2("Padma");

    </script>
</head>




</html>
