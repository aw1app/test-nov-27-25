<div style="border:solid 1px BLUE">

    <H2>PRODUCT LIST V3</H2>

     <ng-container *ngIf="products$ | async as products">

    <table border="1" *ngIf="products.length>0 ; else elseBlock">

        <tr>
            <th>ID </th>
            <th>NAME </th>
            <th>PRICE </th>
            <th>PHOTO </th>

        <tr *ngFor="let prod of products; index as i;">
            <td>{{prod.id}}
            <td> {{prod.name | uppercase}}
            <td> {{prod.price | currency }}
            <td> <img [src]="prod.imagePath" width="100" height="50" /></td>
            <td>  <button (click)="showDetails(prod.id)"> SHOW DETAILS </button> 
            <td> <button (click)="delete(prod.id)"> DELETE </button> </td>       

        </tr>

    </table>

    <ng-template #elseBlock> No Products to Display </ng-template>

    </ng-container>

    <br><br>

</div>
